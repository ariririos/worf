[package]
name = "worf"
description = "Automatically queue similar songs in MPD, remembering the original song."
version = "0.0.11"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ariririos/worf"

[dependencies]
anyhow = "1.0.100"
bliss-audio = { version = "0.11.2", features = ["library", "ffmpeg", "serde"] }
bliss-audio-aubio-sys = { version = "0.2.4", features = ["bindgen"] }
clap = { version = "4.5.48", features = ["derive"] }
env_logger = "0.11.10"
fallible-streaming-iterator = "0.1.9"
ffmpeg-next = "8.0.0"
ffmpeg-sys-next = "8.0.1"
futures = "0.3.32"
glob = "0.3.3"
itertools = "0.14.0"
log = "0.4.28"
mpd = { version = "0.1.0", path = "./rust-mpd" }
ndarray = "0.17.2"
noisy_float = "0.2.0"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
